version: "3.0.0"
description: "E-Paper display driver for ESP-IDF: SSD16xx/SSD1677 panels, L8 LVGL 9.6 pipeline with dirty rectangles and async refresh."
url: "https://github.com/tuanpmt/esp_epaper"
repository: "https://github.com/tuanpmt/esp_epaper.git"
documentation: "https://github.com/tuanpmt/esp_epaper/blob/master/README.md"
issues: "https://github.com/tuanpmt/esp_epaper/issues"
maintainers:
  - "tuanpmt"

dependencies:
  idf:
    version: ">=6.1"
  lvgl/lvgl:
    version: "9.6.0"
    public: true

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32p4
  - esp32s31

license: "MIT"
